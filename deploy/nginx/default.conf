# HTTP (80) -> Let's Encrypt ACME Challenge 처리 및 HTTPS 리다이렉트
server {
    listen 80;
    server_name tcine.duckdns.org _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (443) -> tcine 프로젝트 전용 가상 호스트 (새 프로젝트 추가 시 별도 .conf 파일만 추가하면 됨)
server {
    listen 443 ssl;
    http2 on;
    server_name tcine.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/tcine.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tcine.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=5s ipv6=off;

    # 현재 활성 슬롯 (tcine-blue 또는 tcine-green) 불러오기
    include /etc/nginx/conf.d/tcine-url.inc;

    location / {
        proxy_pass http://$tcine_url:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
