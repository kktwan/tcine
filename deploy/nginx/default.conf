# HTTP (80) -> Let's Encrypt ACME Challenge 처리 및 HTTPS 리다이렉트
server {
    listen 80;
    server_name tcine.duckdns.org _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (443) -> 도커 내장 DNS 리졸버 + Blue/Green 동적 변수 라우팅
server {
    listen 443 ssl;
    http2 on;
    server_name tcine.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/tcine.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tcine.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 도커 내장 DNS 서버 (upstream 없이 컨테이너 이름을 동적으로 해석)
    resolver 127.0.0.11 valid=5s ipv6=off;

    # 현재 활성 슬롯 (tcine-blue 또는 tcine-green) 불러오기
    include /etc/nginx/conf.d/service-url.inc;

    location / {
        proxy_pass http://$service_url:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # AI 추천 및 대량 색인 상태 폴링 여유 타임아웃
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
