# 도커 내부 DNS 리졸버 (upstream 블록 없이 컨테이너 이름을 동적으로 해석해 꺼진 슬롯이 있어도 Nginx가 죽지 않음)
server {
    listen 80;
    server_name _;

    # Let's Encrypt 인증서 발급용 ACME Challenge 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 도커 내장 DNS 서버
    resolver 127.0.0.11 valid=5s ipv6=off;

    # 현재 활성 슬롯 (tcine-blue 또는 tcine-green) 불러오기
    include /etc/nginx/conf.d/service-url.inc;

    location / {
        proxy_pass http://$service_url:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 추천 및 대량 색인 상태 폴링 여유 타임아웃
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
