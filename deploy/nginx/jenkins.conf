# HTTP (80) -> Let's Encrypt ACME Challenge 처리 및 HTTPS 리다이렉트
server {
    listen 80;
    server_name tjenkins.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (443) -> Jenkins 전용 가상 호스트 (tjenkins.duckdns.org -> infra-jenkins:8080)
server {
    listen 443 ssl;
    http2 on;
    server_name tjenkins.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/tjenkins.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tjenkins.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $jenkins_upstream infra-jenkins;

    # Jenkins 웹소켓 및 대용량 로그/플러그인 처리 설정
    ignore_invalid_headers off;
    client_max_body_size 50m;

    location / {
        proxy_pass http://$jenkins_upstream:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Jenkins Blue Ocean / 실시간 콘솔 로그 WebSocket 지원
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 150s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
