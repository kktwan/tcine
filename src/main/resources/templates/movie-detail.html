<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>영화 상세 | 컨텐츠</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <header th:replace="~{fragments :: header('movies', null, null)}"></header>

  <main class="container">
    <a class="back-link" th:href="@{/movies}">← 영화 추천으로</a>

    <div class="empty spaced" th:if="${movie == null}">
      <div class="empty-ic"><svg class="ic"><use th:href="@{/img/icons.svg#compass}"/></svg></div>
      <div>영화 정보를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</div>
    </div>

    <th:block th:if="${movie != null}">
      <!-- 상단 배너: 영화 배경 이미지 위에 포스터와 제목 -->
      <section class="hero">
        <img class="hero-bg" th:if="${movie.backdropPath != null}"
             th:src="'https://image.tmdb.org/t/p/w1280' + ${movie.backdropPath}" alt="">
        <div class="hero-shade"></div>
        <div class="hero-in">
          <div class="hero-poster">
            <img th:if="${movie.posterPath != null}" th:src="'https://image.tmdb.org/t/p/w500' + ${movie.posterPath}"
                 th:alt="${movie.title} + ' 포스터'">
            <div class="poster-empty" th:unless="${movie.posterPath != null}">포스터 없음</div>
          </div>
          <div class="hero-text">
            <h1 th:text="${movie.title}"></h1>
            <p class="hero-orig" th:if="${!#strings.isEmpty(movie.originalTitle) and movie.originalTitle != movie.title}"
               th:text="${movie.originalTitle}"></p>
            <div class="hero-meta">
              <span class="score" th:if="${movie.rating != null and movie.rating > 0}"
                    th:text="'★ ' + ${#numbers.formatDecimal(movie.rating, 1, 1)}"></span>
              <span th:if="${movie.year != null}" th:text="${movie.year}"></span>
              <span th:if="${movie.runtime != null and movie.runtime > 0}" th:text="${movie.runtime} + '분'"></span>
            </div>
            <p class="hero-genres" th:if="${!#strings.isEmpty(movie.genres)}" th:text="${movie.genres}"></p>
            <p class="hero-tagline" th:if="${!#strings.isEmpty(movie.tagline)}" th:text="'“' + ${movie.tagline} + '”'"></p>
            <div class="actions">
              <a class="btn btn-light" th:href="@{/movies(similar=${movie.id})}">이 영화와 비슷한 영화 찾기</a>
            </div>
          </div>
        </div>
      </section>

      <div class="detail-grid">
        <section class="detail-card detail-main">
          <h2>줄거리</h2>
          <p class="detail-overview" th:text="${!#strings.isEmpty(movie.overview)} ? ${movie.overview} : '등록된 줄거리가 없어요.'"></p>
        </section>

        <aside class="detail-side">
          <section class="detail-card" th:if="${!#strings.isEmpty(movie.director)}">
            <h2>감독</h2>
            <div class="pills"><span class="pill pill-strong" th:text="${movie.director}"></span></div>
          </section>
          <section class="detail-card" th:if="${!#lists.isEmpty(movie.cast)}">
            <h2>출연</h2>
            <div class="pills"><span class="pill" th:each="name : ${movie.cast}" th:text="${name}"></span></div>
          </section>
          <section class="detail-card" th:if="${!#lists.isEmpty(movie.keywords)}">
            <h2>키워드</h2>
            <div class="pills"><span class="pill pill-soft" th:each="k : ${movie.keywords}" th:text="${k}"></span></div>
          </section>
        </aside>
      </div>
    </th:block>

    <p class="tmdb-credit">
      이 서비스는 TMDB API를 사용하지만 TMDB의 보증을 받거나 인증된 것은 아닙니다.
      영화 정보 출처: <a href="https://www.themoviedb.org" target="_blank" rel="noopener">The Movie Database (TMDB)</a>
    </p>
  </main>
</body>
</html>
